<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Camera — Hand Dots</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="camera-app">
      <div class="top-bar">
        <div class="brand-pill">Camera</div>
        <button id="flipBtn" class="icon-btn" aria-label="Flip camera" title="Flip camera">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path fill="currentColor" d="M7 7h10v10H7z" opacity="0"/>
            <path fill="currentColor" d="M12 6c-2.21 0-4.21.9-5.66 2.34L4 6v6h6l-2.35-2.35C8.52 8.78 10.16 8 12 8c3.31 0 6 2.69 6 6h2c0-4.42-3.58-8-8-8zm0 12c2.21 0 4.21-.9 5.66-2.34L20 18v-6h-6l2.35 2.35C15.48 15.22 13.84 16 12 16c-3.31 0-6-2.69-6-6H4c0 4.42 3.58 8 8 8z"/>
          </svg>
        </button>
      </div>

      <div id="viewport" class="viewport">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="bottom-bar">
        <button id="startBtn" class="shutter">
          <span>Tap to start</span>
        </button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
