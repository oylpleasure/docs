<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Camera — Hand Dots</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="camera-app">
      <div class="top-bar">
        <div class="brand-pill">Camera</div>
        <button id="flipBtn" class="icon-btn" aria-label="Flip camera" title="Flip camera">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path fill="currentColor" d="M7 7h10v10H7z" opacity="0"/>
            <path fill="currentColor" d="M12 6c-2.21 0-4.21.9-5.66 2.34L4 6v6h6l-2.35-2.35C8.52 8.78 10.16 8 12 8c3.31 0 6 2.69 6 6h2c0-4.42-3.58-8-8-8zm0 12c2.21 0 4.21-.9 5.66-2.34L20 18v-6h-6l2.35 2.35C15.48 15.22 13.84 16 12 16c-3.31 0-6-2.69-6-6H4c0 4.42 3.58 8 8 8z"/>
          </svg>
        </button>
      </div>

      <div id="viewport" class="viewport">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="bottom-bar">
        <button id="startBtn" class="shutter">
          <span>Tap to start</span>
        </button>
      </div>

      <button id="controlsBtn" class="icon-btn floating" aria-label="Controls" title="Controls">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3a7.952 7.952 0 00-.46-1.61l2.12-1.65-2-3.46-2.5 1a7.952 7.952 0 00-1.39-.8l-.38-2.65H9.67l-.38 2.65c-.49.2-.95.46-1.39.8l-2.5-1-2 3.46 2.12 1.65c-.2.52-.36 1.06-.46 1.61l-2.66.41v4l2.66.41c.1.55.26 1.09.46 1.61L1.9 19.26l2 3.46 2.5-1c.44.34.9.6 1.39.8l.38 2.65h4.18l.38-2.65c.49-.2.95-.46 1.39-.8l2.5 1 2-3.46-2.12-1.65c.2-.52.36-1.06.46-1.61l2.66-.41v-4L20.94 11z"/>
        </svg>
      </button>

      <div id="controlsPanel" class="controls hidden">
        <div class="controls-inner">
          <div class="controls-row">
            <label>Volume</label>
            <input id="ctlVolume" type="range" min="0" max="1" step="0.01" value="0.5" />
          </div>
          <div class="controls-row">
            <label>Cutoff base</label>
            <input id="ctlCutoffBase" type="range" min="200" max="5000" step="10" value="1200" />
          </div>
          <div class="controls-row">
            <label>Cutoff map</label>
            <input id="ctlCutoffMap" type="range" min="0" max="1.5" step="0.01" value="0.8" />
          </div>
          <div class="controls-row">
            <label>Pan map</label>
            <input id="ctlPanMap" type="range" min="0" max="1" step="0.01" value="0.8" />
          </div>
          <div class="controls-row">
            <label>Delay mix</label>
            <input id="ctlDelayMix" type="range" min="0" max="1" step="0.01" value="0.3" />
          </div>
          <div class="controls-row">
            <label>Delay time</label>
            <input id="ctlDelayTime" type="range" min="0" max="0.8" step="0.01" value="0.25" />
          </div>
          <div class="controls-row">
            <label>Feedback</label>
            <input id="ctlFeedback" type="range" min="0" max="0.95" step="0.01" value="0.35" />
          </div>
          <div class="controls-row">
            <label>Vibrato depth</label>
            <input id="ctlVibDepth" type="range" min="0" max="120" step="1" value="25" />
          </div>
          <div class="controls-row">
            <label>Vibrato rate</label>
            <input id="ctlVibRate" type="range" min="0.2" max="9" step="0.1" value="5" />
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
  </html>
